<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rhythm — تتبع العادات والتدوين</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rhythm">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --surface: #f6f6f6;
    --surface-2: #ececec;
    --surface-3: #e0e0e0;
    --text: #111111;
    --text-dim: #6b6b6b;
    --text-faint: #a3a3a3;
    --border: #e0e0e0;
    --accent: #111111;
    --accent-contrast: #ffffff;
    --track: #e8e8e8;
    --danger: #b53a3a;
    --radius: 14px;
    --radius-sm: 9px;
  }
  body[data-theme="dark"]{
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-2: #202020;
    --surface-3: #2a2a2a;
    --text: #f5f5f5;
    --text-dim: #9a9a9a;
    --text-faint: #626262;
    --border: #262626;
    --accent: #ffffff;
    --accent-contrast: #0a0a0a;
    --track: #202020;
    --danger: #d97a7a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;min-height:100vh;line-height:1.5;transition:background .2s,color .2s;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .app{max-width:960px;margin:0 auto;padding:28px 20px 80px;}

  .hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;padding-bottom:20px;border-bottom:2px solid var(--text);gap:16px;flex-wrap:wrap;}
  .hero h1{font-size:38px;font-weight:900;margin:0;letter-spacing:-.5px;}
  .hero .sub{color:var(--text-dim);font-size:14px;margin-top:4px;font-weight:400;}
  .hero-right{display:flex;align-items:center;gap:10px;}
  .today-badge{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:20px;white-space:nowrap;}
  .theme-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:.15s;}
  .theme-btn:hover{background:var(--surface-2);}

  .tabs{display:flex;gap:6px;margin-bottom:22px;background:var(--surface);padding:5px;border-radius:12px;border:1px solid var(--border);width:fit-content;flex-wrap:wrap;}
  .tab{padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text-dim);transition:.15s;user-select:none;}
  .tab.active{background:var(--accent);color:var(--accent-contrast);}
  .tab:not(.active):hover{color:var(--text);background:var(--surface-2);}

  .view{display:none;}
  .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .add-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:20px;}
  .add-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .add-row input[type=text]{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:var(--radius-sm);font-family:inherit;font-size:15px;outline:none;transition:.15s;}
  .add-row input[type=text]:focus{border-color:var(--text);}
  .add-row input[type=text]::placeholder{color:var(--text-faint);}
  .btn{background:var(--accent);color:var(--accent-contrast);border:none;padding:11px 22px;border-radius:var(--radius-sm);font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap;}
  .btn:hover{opacity:.85;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text);border-color:var(--text);}
  .btn.sm{padding:7px 14px;font-size:12.5px;}

  .habit-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;margin-bottom:16px;}
  .habit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .habit-name-wrap{display:flex;align-items:center;gap:10px;min-width:0;}
  .monogram{width:32px;height:32px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .habit-name{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stats{display:flex;gap:14px;align-items:center;flex-shrink:0;}
  .stat{text-align:center;}
  .stat .num{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;}
  .stat .lbl{font-size:10px;color:var(--text-faint);}
  .del-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px;transition:.15s;line-height:1;}
  .del-btn:hover{color:var(--danger);}
  .del-btn.confirm{color:var(--accent-contrast);background:var(--danger);font-size:11px;padding:6px 10px;}

  .slide-wrap{margin-bottom:2px;}
  .slide-track{direction:ltr;position:relative;height:46px;border-radius:23px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y;}
  .slide-fill{position:absolute;inset:0;background:var(--accent);width:0%;transition:width .05s linear;}
  .slide-fill.animated{transition:width .25s ease;}
  .slide-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--text-dim);pointer-events:none;letter-spacing:.2px;}
  .slide-label.on-fill{color:var(--accent-contrast);}
  .slide-thumb{position:absolute;top:3px;right:3px;width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;transition:right .05s linear,background .15s;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .slide-thumb.animated{transition:right .25s ease;}
  .slide-track.done .slide-thumb{background:var(--accent-contrast);color:var(--accent);}

  .heatmap-scroll{overflow-x:auto;padding-bottom:4px;direction:ltr;}
  .heatmap-scroll::-webkit-scrollbar{height:6px;}
  .heatmap-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .heatmap{display:flex;flex-direction:row-reverse;gap:3px;direction:rtl;width:fit-content;margin-right:auto;margin-left:0;}
  .week-col{display:flex;flex-direction:column;gap:3px;}
  .day-cell{width:11px;height:11px;border-radius:3px;background:var(--track);cursor:pointer;transition:.1s;position:relative;}
  .day-cell:hover{outline:1px solid var(--text-dim);}
  .day-cell.filled{background:var(--accent) !important;}
  .day-cell.future{cursor:not-allowed;opacity:.35;}
  .day-cell.today{outline:1.5px solid var(--text);}
  .month-labels{display:flex;flex-direction:row-reverse;gap:3px;font-size:10px;color:var(--text-faint);margin-bottom:5px;direction:rtl;width:fit-content;margin-right:auto;}
  .month-labels span{width:11px;overflow:visible;white-space:nowrap;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--text-faint);}
  .empty-state .big{font-size:32px;margin-bottom:8px;}

  /* History page */
  .hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .year-nav{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:5px 14px;}
  .year-nav button{background:none;border:none;color:var(--text);cursor:pointer;font-size:15px;padding:2px 4px;}
  .year-nav .yr{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;}

  /* Dashboard */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:20px;}
  .dash-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;}
  .dash-tile .big-num{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;}
  .dash-tile .lbl{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .ring-wrap{display:flex;justify-content:center;margin-bottom:6px;}
  .bar-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .bar-row:last-child{border-bottom:none;}
  .bar-name{width:120px;flex-shrink:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .4s ease;}
  .bar-pct{width:42px;flex-shrink:0;text-align:left;font-family:'JetBrains Mono',monospace;font-size:13px;}
  .week-matrix{display:grid;grid-template-columns:130px repeat(7,1fr);gap:6px;align-items:center;margin-top:6px;}
  .wm-head{font-size:10px;color:var(--text-faint);text-align:center;}
  .wm-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wm-cell{width:100%;aspect-ratio:1;border-radius:6px;background:var(--surface-2);}
  .wm-cell.on{background:var(--accent);}

  .journal-layout{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .cal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;flex:1;min-width:290px;}
  .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .cal-nav .label{font-weight:700;font-size:16px;}
  .nav-btn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;}
  .nav-btn:hover{border-color:var(--text);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--text-faint);padding-bottom:6px;}
  .cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;font-size:13px;font-family:'JetBrains Mono',monospace;background:var(--surface-2);position:relative;transition:.12s;}
  .cal-day:hover{background:var(--surface-3);}
  .cal-day.today{border:1.5px solid var(--text);font-weight:700;}
  .cal-day.selected{background:var(--accent);color:var(--accent-contrast);font-weight:700;}
  .cal-day.empty{background:none;cursor:default;}
  .cal-day .has-entry{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--text-dim);}
  .cal-day.selected .has-entry{background:var(--accent-contrast);}
  .entry-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;flex:1.3;min-width:300px;}
  .entry-date{font-size:14px;color:var(--text-dim);margin-bottom:10px;font-weight:700;}
  .entry-date .mono{color:var(--text);}
  textarea{width:100%;min-height:260px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:14px;font-family:'Cairo',sans-serif;font-size:14.5px;line-height:1.7;resize:vertical;outline:none;transition:.15s;}
  textarea:focus{border-color:var(--text);}
  textarea::placeholder{color:var(--text-faint);}
  .save-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .save-hint{font-size:12px;color:var(--text-faint);}

  .loading{text-align:center;padding:100px 20px;color:var(--text-faint);font-size:14px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:var(--accent-contrast);padding:12px 22px;border-radius:24px;
    font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .3s,transform .3s;
    z-index:9999;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Books */
  .book-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .book-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
  .book-title-wrap{min-width:0;}
  .book-title{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .book-author{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .book-status{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);white-space:nowrap;flex-shrink:0;}
  .book-status.done{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
  .book-progress-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .book-bar-track{flex:1;height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
  .book-bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s ease;}
  .book-pages-input{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .book-pages-input input{width:56px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 6px;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:12.5px;text-align:center;outline:none;}
  .book-pages-input input:focus{border-color:var(--text);}
  .book-pages-sep{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-faint);}
  .book-pct{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-dim);flex-shrink:0;width:38px;text-align:left;}
  .book-notes-label{font-size:12px;color:var(--text-faint);margin-bottom:6px;}
  .book-notes{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:12px;font-family:'Cairo',sans-serif;font-size:14px;line-height:1.7;resize:vertical;outline:none;transition:.15s;}
  .book-notes:focus{border-color:var(--text);}
  .book-notes::placeholder{color:var(--text-faint);}
  .book-meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .book-save-hint{font-size:11px;color:var(--text-faint);}

  .habit-meta{font-size:11.5px;color:var(--text-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .habit-card.rest{opacity:.6;}
  .habit-tools{display:flex;gap:8px;margin-top:10px;justify-content:flex-start;}
  .tool-btn{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:inherit;font-size:11.5px;padding:4px 10px;border-radius:14px;cursor:pointer;}
  .tool-btn:hover{color:var(--text);border-color:var(--text);}
  .excused-bar{height:46px;border-radius:23px;border:1px dashed var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-dim);cursor:pointer;background:repeating-linear-gradient(45deg,transparent 0 8px,var(--surface-2) 8px 16px);}
  .counter{position:relative;display:flex;align-items:center;justify-content:space-between;height:46px;border-radius:23px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
  .counter-fill{position:absolute;top:0;bottom:0;right:0;background:var(--accent);opacity:.18;transition:width .3s;}
  .counter.done .counter-fill{opacity:1;}
  .counter.done .cval,.counter.done .cbtn{color:var(--accent-contrast);}
  .cbtn{position:relative;z-index:1;width:46px;height:46px;border:none;background:none;color:var(--text);font-size:22px;cursor:pointer;font-family:inherit;}
  .cval{position:relative;z-index:1;font-size:15px;font-weight:700;cursor:pointer;}
  .cunit{font-family:'Cairo',sans-serif;font-weight:400;font-size:12px;}
  .habit-settings{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;}
  .habit-settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-dim);flex:1;}
  .habit-settings input[type=text],.habit-settings input[type=number],.habit-settings select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--radius-sm);font-family:inherit;font-size:14px;outline:none;}
  .hs-row{display:flex;gap:10px;flex-wrap:wrap;}
  .hs-days{display:flex;gap:6px;flex-wrap:wrap;}
  .habit-settings label.daychip{flex:none;flex-direction:row;align-items:center;gap:0;}
  .daychip input{display:none;}
  .daychip span{padding:6px 10px;border:1px solid var(--border);border-radius:14px;font-size:12px;cursor:pointer;color:var(--text-dim);}
  .daychip input:checked + span{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
  .hs-actions{display:flex;gap:8px;}
  .day-cell.excused,.wm-cell.excused{background:repeating-linear-gradient(45deg,var(--track) 0 2px,var(--text-faint) 2px 3px) !important;}
  .day-cell.off,.wm-cell.off{opacity:.35;}
  .day-cell[data-part="1"],.wm-cell[data-part="1"]{background:color-mix(in srgb, var(--accent) calc(var(--p) * 100%), var(--track));}
  .today-badge{display:flex;flex-direction:column;align-items:center;line-height:1.35;border-radius:14px !important;}
  .today-badge .hijri{font-family:'Cairo',sans-serif;font-size:11px;color:var(--text-dim);}
  .hijri-sub{font-size:11.5px;font-weight:400;color:var(--text-dim);display:block;}
  .cal-day .hday{font-size:8.5px;color:var(--text-faint);line-height:1;margin-top:1px;}
  .cal-day.selected .hday{color:var(--accent-contrast);opacity:.7;}
  @media (max-width:600px){
    .hero h1{font-size:28px;}
    .stats{gap:10px;}
    .stat .num{font-size:15px;}
    .bar-name{width:80px;}
    .week-matrix{grid-template-columns:80px repeat(7,1fr);}
  }
</style>
</head>

<div class="app" id="app">

</div>

<script>
const DOW_LABELS = ['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'];
const MONTH_LABELS = ['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];

let state = { habits: [], journal: {}, books: [], readingGoal: null };
let theme = 'light';
let activeTab = 'habits';
let histYear = new Date().getFullYear();
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let selectedDate = fmtDate(new Date());
let confirmingDelete = null;
let audioCtx = null;

function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStr(){ return fmtDate(new Date()); }
function uid(){ return 'h_'+Math.random().toString(36).slice(2,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

// ---------- Local storage layer (IndexedDB) — data lives on this device only ----------
const DB_NAME = 'ratm-db';
const STORE_NAME = 'kv';
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NAME); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
const storage = {
  async get(key){
    try{
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result !== undefined ? { key, value: req.result } : null);
        req.onerror = () => reject(req.error);
      });
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(value, key);
        tx.oncomplete = () => resolve({ key, value });
        tx.onerror = () => reject(tx.error);
      });
    }catch(e){ return null; }
  }
};

// ---------- Cloud sync (Firebase) — local IndexedDB stays the source for offline use ----------
const firebaseConfig = {

const SOUNDS = [
  {id:'chime', label:'جرس ثلاثي', icon:'♪'},
  {id:'tap',   label:'نقرة خفيفة', icon:'•'},

let soundId = 'chime';
function tone(freq, t0, dur, peak, type){
  const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
  return o;
}
function playChime(id){
  id = id || soundId;
  if(id==='off') return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    if(id==='tap'){
      tone(1200, now, 0.06, 0.25, 'triangle');
      tone(1800, now+0.045, 0.05, 0.12, 'triangle');
    } else if(id==='bell'){
      [220, 440, 660, 1320].forEach((f,i)=> tone(f, now, 1.2 - i*0.2, [0.25,0.18,0.08,0.04][i]));
    } else if(id==='levelup'){
      [392, 523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> tone(f, now+i*0.06, 0.18, 0.16, 'square'));
    } else {
      [523.25,659.25,783.99].forEach((f,i)=> tone(f, now+i*0.07, 0.28, 0.22));
    }
  }catch(e){}
}

// ---------- Habit model: types (check/count), schedules, excused days ----------
const DOW_FULL = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmtDate(d); }
function weekStart(s){ const d=parseD(s); d.setDate(d.getDate()-((d.getDay()+1)%7)); return fmtDate(d); } // week starts Saturday
function hType(h){ return h.type==='count' ? 'count' : 'check'; }
function hSched(h){ return h.schedule || {type:'daily'}; }
function isWeekly(h){ return hSched(h).type==='weekly'; }
function weeklyTarget(h){ return Math.max(1, Math.min(7, parseInt(hSched(h).times)||3)); }
function hTarget(h){ return Math.max(1, Number(h.target)||1); }
function startOf(h){ return h.createdAt || todayStr(); }
function entryVal(h,d){ const v=(h.entries||{})[d]; if(v===true) return hType(h)==='count' ? hTarget(h) : 1; return typeof v==='number' ? v : 0; }
function isDone(h,d){ const v=(h.entries||{})[d]; if(v===undefined||v===null||v===false) return false; if(hType(h)==='check') return !!v; return v===true || v>=hTarget(h); }
function progressOf(h,d){ return hType(h)==='check' ? (isDone(h,d)?1:0) : Math.min(1, entryVal(h,d)/hTarget(h)); }
function isExcused(h,d){ return !!(h.excused && h.excused[d]); }
function isScheduled(h,d){ const s=hSched(h); return s.type==='days' ? (s.days||[]).includes(parseD(d).getDay()) : true; }
function fmtNum(n){ return Number.isInteger(n) ? String(n) : String(Math.round(n*10)/10); }
function weekInfo(h, ws){
  const today=todayStr(), from=startOf(h);
  let done=0, exc=0, avail=0;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    if(isDone(h,d)) done++;
    if(d<from || d>today) continue;
    if(isExcused(h,d)) exc++; else avail++;
  }
  let req = Math.max(0, weeklyTarget(h)-exc);
  if(ws < from) req = Math.min(req, avail);           // first, partial week
  const isCurrent = addDays(ws,6) >= today;
  return { done, req, met: req>0 && done>=req, neutral: req===0, isCurrent };
}
function scheduleText(h){
  const s=hSched(h);
  if(s.type==='weekly') return `${weeklyTarget(h)} مرات بالأسبوع`;
  if(s.type==='days') return (s.days||[]).slice().sort().map(i=>DOW_FULL[i]).join('، ') || 'بدون أيام';
  return 'يومياً';
}
function computeStreaks(h){
  const today=todayStr();
  const keys=Object.keys(h.entries||{}).sort();
  const from = keys[0] && keys[0]<startOf(h) ? keys[0] : startOf(h);
  const total = keys.filter(d=>isDone(h,d)).length;
  if(isWeekly(h)){
    const weeks=[]; for(let ws=weekStart(from); ws<=today; ws=addDays(ws,7)) weeks.push(weekInfo(h,ws));
    let best=0, run=0;
    weeks.forEach(w=>{ if(w.neutral) return; if(w.met){ run++; best=Math.max(best,run); } else if(!w.isCurrent) run=0; });
    let cur=0;
    for(let i=weeks.length-1;i>=0;i--){ const w=weeks[i]; if(w.neutral) continue; if(w.met) cur++; else if(w.isCurrent) continue; else break; }
    return {current:cur, best, total, unit:'week'};
  }
  let best=0, run=0;
  for(let d=from; d<=today; d=addDays(d,1)){
    if(!isScheduled(h,d) || isExcused(h,d)) continue;
    if(isDone(h,d)){ run++; best=Math.max(best,run); } else if(d!==today) run=0;
  }
  let cur=0;
  for(let d=today; d>=from; d=addDays(d,-1)){
    if(!isScheduled(h,d) || isExcused(h,d)) continue;
    if(isDone(h,d)) cur++; else if(d===today) continue; else break;
  }
  return {current:cur, best, total, unit:'day'};
}
function computePercentage(h){
  const today=todayStr(), start=startOf(h);
  let got=0, need=0;
  if(isWeekly(h)){
    for(let ws=weekStart(start); ws<=today; ws=addDays(ws,7)){
      const w=weekInfo(h,ws); if(w.neutral) continue;
      if(w.isCurrent && !w.met){ got+=w.done; need+=w.done; continue; }
      got+=Math.min(w.done,w.req); need+=w.req;
    }
  } else {
    for(let d=start; d<=today; d=addDays(d,1)){
      if(!isScheduled(h,d) || isExcused(h,d)) continue;
      const p=progressOf(h,d);
      if(d===today && p<1) continue;      // today isn't over yet
      got+=p; need++;
    }
  }
  return need ? Math.min(100, Math.round(got/need*100)) : 0;
}
// share of what was expected across a set of days (used by dashboard & trend)
function windowPct(days){
  const today=todayStr(); let got=0, need=0;
  state.habits.forEach(h=>{
    let g=0, n=0;
    days.forEach(d=>{
      if(d<startOf(h) || d>today || isExcused(h,d)) return;
      if(isWeekly(h)){ n+=weeklyTarget(h)/7; if(isDone(h,d)) g++; return; }
      if(!isScheduled(h,d)) return;
      const p=progressOf(h,d);
      if(d===today && p<1) return;
      g+=p; n++;
    });
    got+=Math.min(g,n); need+=n;
  });
  return need ? Math.round(got/need*100) : null;
}
function streakUnitLabel(s){ return s.unit==='week' ? 'أسابيع' : 'الحالي'; }

const MILESTONES = [7, 30, 100];
function milestoneBadge(streak){

function checkMilestone(habit){
  const s = computeStreaks(habit);
  habit.celebrated = habit.celebrated || [];
  const list = s.unit==='week' ? [4,12,52] : MILESTONES;
  list.forEach(m=>{
    const tag = s.unit==='week' ? 'w'+m : m;
    if(s.current>=m && !habit.celebrated.includes(tag)){
      habit.celebrated.push(tag);
      showToast(`🎉 ${m} ${s.unit==='week'?'أسبوع':'يوم'} متتالي في «${habit.name}»!`);
    }
  });
}

function buildYearWeeks(year){
  const start = new Date(year,0,1); const end = new Date(year,11,31);
  const startDow = start.getDay();
  const firstCellDate = new Date(start); firstCellDate.setDate(firstCellDate.getDate()-startDow);
  const weeks=[]; let cursor = new Date(firstCellDate);
  while(cursor<=end){
    const week=[];
    for(let i=0;i<7;i++){ week.push(cursor.getFullYear()===year ? fmtDate(cursor) : null); cursor.setDate(cursor.getDate()+1); }
    weeks.push(week);
  }
  return weeks;
}

function renderHeatmap(habit, year){
  const weeks = buildYearWeeks(year);
  const today = todayStr();
  let monthLabelsHtml = ''; let lastMonth = -1;
  weeks.forEach(week=>{
    const firstReal = week.find(d=>d);
    if(firstReal){
      const m = new Date(firstReal).getMonth();
      if(m!==lastMonth){ monthLabelsHtml += `<span>${MONTH_LABELS[m]}</span>`; lastMonth=m; } else monthLabelsHtml += `<span></span>`;
    } else monthLabelsHtml += `<span></span>`;
  });
  let gridHtml = '';
  weeks.forEach(week=>{
    let colHtml = '<div class="week-col">';
    week.forEach(d=>{
      if(!d){ colHtml += `<div class="day-cell" style="visibility:hidden"></div>`; return; }
      const filled = isDone(habit,d);
      const exc = isExcused(habit,d);
      const part = !filled && hType(habit)==='count' ? progressOf(habit,d) : 0;
      const off = !isWeekly(habit) && !isScheduled(habit,d);
      const isFuture = d > today;
      const isToday = d === today;
      const tip = d + (exc?' · معذور':'') + (hType(habit)==='count'&&entryVal(habit,d)?' · '+fmtNum(entryVal(habit,d))+' '+(habit.unit||''):'');
      colHtml += `<div class="day-cell ${filled?'filled':''} ${exc?'excused':''} ${off?'off':''} ${isFuture?'future':''} ${isToday?'today':''}"
        ${part>0?`style="--p:${(0.2+part*0.6).toFixed(2)}"`:''} data-part="${part>0?1:0}"
        title="${tip}" data-habit="${habit.id}" data-date="${d}" ${isFuture?'':'onclick="toggleEntry(this)"'}></div>`;
    });
    colHtml += '</div>'; gridHtml += colHtml;
  });
  return `<div class="month-labels">${monthLabelsHtml}</div><div class="heatmap-scroll"><div class="heatmap">${gridHtml}</div></div>`;
}

function setExcused(h,d,on){ h.excused = h.excused || {}; if(on){ h.excused[d]=true; delete h.entries[d]; } else delete h.excused[d]; }
window.toggleEntry = function(el){
  const id = el.getAttribute('data-habit'); const date = el.getAttribute('data-date');
  const habit = state.habits.find(h=>h.id===id); if(!habit) return;
  const wasDone = isDone(habit,date);
  if(hType(habit)==='count'){
    const cur = isExcused(habit,date) ? 'ع' : (entryVal(habit,date) ? fmtNum(entryVal(habit,date)) : '');
    const v = prompt(`«${habit.name}» يوم ${date}\nاكتب الرقم (الهدف ${fmtNum(hTarget(habit))} ${habit.unit||''})، أو ع = معذور، أو اتركه فاضي للمسح:`, cur);
    if(v===null) return;
    const t = v.trim();
    if(t==='ع'){ setExcused(habit,date,true); }
    else if(t===''){ setExcused(habit,date,false); delete habit.entries[date]; }
    else { const n = parseFloat(t.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c))); if(isNaN(n)) return; setExcused(habit,date,false); if(n>0) habit.entries[date]=n; else delete habit.entries[date]; }
  } else {
    // cycle: empty → done → excused → empty
    if(isExcused(habit,date)) setExcused(habit,date,false);
    else if(wasDone){ delete habit.entries[date]; setExcused(habit,date,true); }
    else habit.entries[date] = true;
  }
  if(!wasDone && isDone(habit,date) && date===todayStr()){ playChime(); checkMilestone(habit); }
  saveHabits(); render();
};

function renderSlide(habit){
  const today = todayStr(); const done = !!habit.entries[today];
  return `
    <div class="slide-wrap">
      <div class="slide-track ${done?'done':''}" id="track-${habit.id}" data-habit="${habit.id}" onpointerdown="slideStart(event,'${habit.id}')">
        <div class="slide-fill animated" id="fill-${habit.id}" style="width:${done?'100':'0'}%"></div>
        <div class="slide-label ${done?'on-fill':''}" id="label-${habit.id}">${done ? 'تمت اليوم ✓ — اسحب للإلغاء' : (isScheduled(habit,today) ? 'اسحب لليمين لتأكيد اليوم →' : 'مو مطلوبة اليوم — اسحب لو سويتها →')}</div>
        <div class="slide-thumb animated" id="thumb-${habit.id}" style="right:${done?'calc(100% - 43px)':'3px'}">${done?'✓':'○'}</div>
      </div>
    </div>
  `;
}

let dragState = null;
window.slideStart = function(e, habitId){
  const habit = state.habits.find(h=>h.id===habitId); if(!habit) return;
  const track = document.getElementById('track-'+habitId);
  const thumb = document.getElementById('thumb-'+habitId);
  const fill = document.getElementById('fill-'+habitId);
  const label = document.getElementById('label-'+habitId);
  const rect = track.getBoundingClientRect();
  const wasDone = !!habit.entries[todayStr()];
  thumb.classList.remove('animated'); fill.classList.remove('animated');
  dragState = { habitId, rect, wasDone, track, thumb, fill, label, moved:false };
  try{ track.setPointerCapture(e.pointerId); }catch(err){}
  document.onpointermove = slideMove; document.onpointerup = slideEnd;
};
function slideMove(e){
  if(!dragState) return; dragState.moved = true;
  const { rect, thumb, fill, label } = dragState;
  const thumbW = 40, pad = 3;
  let x = e.clientX - rect.left - thumbW/2;
  const maxX = rect.width - thumbW - pad;
  x = Math.max(0, Math.min(maxX, x));
  const pct = maxX>0 ? x/maxX : 0;
  thumb.style.right = (rect.width - x - thumbW - pad) + 'px';
  fill.style.width = (pct*100) + '%';
  label.classList.toggle('on-fill', pct>0.45);
  dragState._pct = pct;
}
function slideEnd(){
  document.onpointermove = null; document.onpointerup = null;
  if(!dragState) return;
  const { habitId, wasDone, thumb, fill, label, moved, track } = dragState;
  thumb.classList.add('animated'); fill.classList.add('animated');
  const pct = dragState._pct || 0;
  const habit = state.habits.find(h=>h.id===habitId);
  const today = todayStr();
  let shouldBeDone = wasDone;
  if(moved){ shouldBeDone = pct >= 0.6 ? true : (pct <= 0.15 ? false : wasDone); }
  else { shouldBeDone = !wasDone; }
  if(shouldBeDone){
    thumb.style.right = 'calc(100% - 43px)'; fill.style.width = '100%';
    label.textContent = 'تمت اليوم ✓ — اسحب للإلغاء'; label.classList.add('on-fill'); track.classList.add('done');
    if(!wasDone){ habit.entries[today] = true; playChime(); checkMilestone(habit); }
  } else {
    thumb.style.right = '3px'; fill.style.width = '0%';
    label.textContent = 'اسحب لليمين لتأكيد اليوم →'; label.classList.remove('on-fill'); track.classList.remove('done');
    if(wasDone){ delete habit.entries[today]; }
  }
  dragState = null; saveHabits(); setTimeout(render, 200);
}

// ---------- Trend chart ----------
function computeWeeklyTrend(weeksCount){
  const points = [];
  for(let i=weeksCount-1; i>=0; i--){
    const windowEnd = new Date(); windowEnd.setDate(windowEnd.getDate() - i*7);
    const days = [];
    for(let d=6; d>=0; d--){ const dt = new Date(windowEnd); dt.setDate(dt.getDate()-d); days.push(fmtDate(dt)); }
    const pct = windowPct(days) ?? 0;
    points.push({ label: windowEnd, pct });
  }
  return points;
}
function renderTrendChart(){
  const points = computeWeeklyTrend(10);
  const w = 640, h = 160, padL = 32, padR = 10, padT = 14, padB = 24;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const stepX = points.length>1 ? plotW/(points.length-1) : 0;
  const coords = points.map((p,i)=>({
    x: padL + i*stepX,
    y: padT + plotH - (p.pct/100)*plotH,
    pct: p.pct, label: p.label
  }));
  const linePath = coords.map((c,i)=> (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaPath = linePath + ` L${coords[coords.length-1].x.toFixed(1)},${(padT+plotH).toFixed(1)} L${coords[0].x.toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  const gridLines = [0,25,50,75,100].map(v=>{
    const y = padT + plotH - (v/100)*plotH;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
            <text x="${padL-6}" y="${y+3}" font-size="9" fill="var(--text-faint)" text-anchor="end" font-family="JetBrains Mono, monospace">${v}</text>`;
  }).join('');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="var(--accent)"><title>${c.pct}%</title></circle>`).join('');
  const labels = coords.map((c,i)=>{
    if(i%2!==0 && i!==coords.length-1) return '';
    const lbl = `${c.label.getDate()}/${c.label.getMonth()+1}`;
    return `<text x="${c.x.toFixed(1)}" y="${h-4}" font-size="9" fill="var(--text-faint)" text-anchor="middle" font-family="JetBrains Mono, monospace">${lbl}</text>`;
  }).join('');
  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
      ${gridLines}
      <path d="${areaPath}" fill="var(--accent)" opacity="0.08"/>
      <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>
  `;
}

// ---------- Backup / Restore ----------
window.exportBackup = function(){
  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    habits: state.habits,
    journal: state.journal,
    books: state.books,
    readingGoal: state.readingGoal,
    theme
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ratm-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
  showToast('تم تنزيل النسخة الاحتياطية ✓');
};

window.importBackup = function(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(Array.isArray(data.habits)) state.habits = data.habits;
      if(data.journal && typeof data.journal==='object') state.journal = data.journal;
      if(Array.isArray(data.books)) state.books = data.books;
      if(data.readingGoal) state.readingGoal = data.readingGoal;
      if(data.theme) theme = data.theme;
      await saveHabits(); await saveJournal(); await saveBooks(); await saveReadingGoal(); await saveTheme();
      render();
      showToast('تم استيراد النسخة الاحتياطية ✓');
    }catch(err){
      showToast('⚠ فشل الاستيراد — تأكد أن الملف صحيح');
    }
  };
  reader.readAsText(file);
};

// ---------- Books ----------
function renderReadingGoalCard(){
  const year = new Date().getFullYear();
  const goal = state.readingGoal && state.readingGoal.year===year ? state.readingGoal.target : null;
  const completedThisYear = state.books.filter(b=> b.completedAt && b.completedAt.startsWith(String(year))).length;
  if(!goal){
    return `
      <div class="hist-card">
        <div class="habit-name" style="margin-bottom:10px;">🎯 هدف القراءة لعام ${year}</div>
        <div class="add-row">
          <input type="number" id="reading-goal-input" placeholder="كم كتاب تبي تقرأ هذي السنة؟" min="1" style="max-width:220px;">
          <button class="btn sm" onclick="setReadingGoal()">حفظ الهدف</button>
        </div>
      </div>
    `;
  }
  const pct = Math.min(100, Math.round((completedThisYear/goal)*100));
  return `
    <div class="hist-card">
      <div class="habit-head" style="margin-bottom:10px;">
        <div class="habit-name">🎯 هدف القراءة لعام ${year}</div>
        <button class="btn ghost sm" onclick="editReadingGoal()">تعديل</button>
      </div>
      <div class="bar-row" style="border-bottom:none;padding:0;">
        <div class="bar-name" style="width:auto;">${completedThisYear} / ${goal} كتاب</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-pct mono">${pct}%</div>
      </div>
    </div>
  `;
}
window.setReadingGoal = function(){
  const input = document.getElementById('reading-goal-input');
  const target = parseInt(input.value)||0;
  if(target<=0) return;
  state.readingGoal = { year: new Date().getFullYear(), target };
  saveReadingGoal(); render();
};
window.editReadingGoal = function(){
  state.readingGoal = null;
  render();
};

function renderBooksView(){
  let html = renderReadingGoalCard();
  html += `
    <div class="add-card">
      <div class="add-row">
        <input type="text" id="new-book-title" placeholder="اسم الكتاب" style="flex:1.5;">
        <input type="text" id="new-book-author" placeholder="المؤلف (اختياري)" style="flex:1;">
        <input type="number" id="new-book-pages" placeholder="عدد الصفحات" min="1" style="width:120px;flex:none;">
        <button class="btn" onclick="addBook()">+ إضافة كتاب</button>
      </div>
    </div>
  `;
  if(state.books.length===0){
    html += `<div class="empty-state"><div class="big">▤</div>أضف أول كتاب تقرأه حاليًا أو تخطط له</div>`;
    return html;
  }
  state.books.forEach(book=>{
    const total = Math.max(1, parseInt(book.totalPages)||1);
    const current = Math.min(total, Math.max(0, parseInt(book.currentPage)||0));
    const pct = Math.round((current/total)*100);
    const done = current>=total;
    const isConfirming = confirmingDeleteBook===book.id;
    const rating = book.rating||0;
    const starsHtml = done ? `
      <div style="margin:10px 0;">
        ${[1,2,3,4,5].map(n=>`<span onclick="setBookRating('${book.id}', ${n})" style="cursor:pointer;font-size:20px;color:${n<=rating?'var(--accent)':'var(--border)'};">★</span>`).join('')}
      </div>
    ` : '';
    html += `
      <div class="book-card">
        <div class="book-head">
          <div class="book-title-wrap">
            <div class="book-title">${escapeHtml(book.title)}</div>
            ${book.author ? `<div class="book-author">${escapeHtml(book.author)}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="book-status ${done?'done':''}">${done?'مكتمل ✓':(current===0?'لم يبدأ':'قيد القراءة')}</div>
            <button class="del-btn ${isConfirming?'confirm':''}" onclick="deleteBook('${book.id}')">${isConfirming?'تأكيد الحذف؟':'✕'}</button>
          </div>
        </div>
        <div class="book-progress-row">
          <div class="book-pages-input">
            <input type="number" min="0" max="${total}" value="${current}" onchange="updateBookPage('${book.id}', this.value)">
            <span class="book-pages-sep">/ ${total}</span>
          </div>
          <div class="book-bar-track"><div class="book-bar-fill" style="width:${pct}%"></div></div>
          <div class="book-pct mono">${pct}%</div>
        </div>
        ${starsHtml}
        <div class="book-notes-label">ملاحظاتي عن الكتاب</div>
        <textarea class="book-notes" id="book-notes-${book.id}" placeholder="اكتب أفكارك، اقتباسات، أو ملخصًا…" oninput="onBookNotesInput('${book.id}', this.value)">${escapeHtml(book.notes||'')}</textarea>
        <div class="book-meta-row">
          <div class="book-save-hint" id="book-save-hint-${book.id}">يُحفظ تلقائيًا</div>
        </div>
      </div>
    `;
  });
  return html;
}

window.addBook = function(){
  const titleInput = document.getElementById('new-book-title');
  const authorInput = document.getElementById('new-book-author');
  const pagesInput = document.getElementById('new-book-pages');
  const title = titleInput.value.trim();
  const author = authorInput.value.trim();
  const totalPages = parseInt(pagesInput.value) || 0;
  if(!title || totalPages<=0) return;
  state.books.push({ id: uid(), title, author, totalPages, currentPage: 0, notes: '', createdAt: todayStr() });
  saveBooks(); render();
};

let confirmingDeleteBook = null;
window.deleteBook = function(id){
  if(confirmingDeleteBook===id){
    state.books = state.books.filter(b=>b.id!==id);
    confirmingDeleteBook=null;
    saveBooks();
  } else {
    confirmingDeleteBook = id;
    setTimeout(()=>{ if(confirmingDeleteBook===id){ confirmingDeleteBook=null; render(); } }, 3000);
  }
  render();
};

window.updateBookPage = function(id, value){
  const book = state.books.find(b=>b.id===id);
  if(!book) return;
  const total = Math.max(1, parseInt(book.totalPages)||1);
  let v = parseInt(value) || 0;
  v = Math.max(0, Math.min(total, v));
  const wasDone = (parseInt(book.currentPage)||0) >= total;
  book.currentPage = v;
  const isDone = v >= total;
  if(isDone && !wasDone){
    book.completedAt = todayStr();
    showToast(`🎉 أنهيت كتاب «${book.title}»!`);
  } else if(!isDone && wasDone){
    delete book.completedAt;
  }
  saveBooks(); render();
};

window.setBookRating = function(id, rating){
  const book = state.books.find(b=>b.id===id);
  if(!book) return;
  book.rating = book.rating===rating ? 0 : rating;
  saveBooks(); render();
};

let bookNotesSaveTimeout = {};
window.onBookNotesInput = function(id, val){
  const book = state.books.find(b=>b.id===id);
  if(!book) return;
  book.notes = val;
  const hint = document.getElementById('book-save-hint-'+id);
  if(hint) hint.textContent = 'جارٍ الحفظ…';
  clearTimeout(bookNotesSaveTimeout[id]);
  bookNotesSaveTimeout[id] = setTimeout(async ()=>{
    await saveBooks();
    const h = document.getElementById('book-save-hint-'+id);
    if(h) h.textContent = 'تم الحفظ ✓';
  }, 500);
};

// ---------- Journal ----------
let journalSearchQuery = '';
function renderJournalView(){
  const searchBar = `
    <div class="add-card">
      <div class="add-row">
        <input type="text" id="journal-search" placeholder="ابحث في تدويناتك…" value="${escapeHtml(journalSearchQuery)}" oninput="onJournalSearch(this.value)">
        ${journalSearchQuery ? `<button class="btn ghost sm" onclick="clearJournalSearch()">✕ مسح البحث</button>` : ''}
      </div>
    </div>
  `;

  if(journalSearchQuery.trim()){
    const q = journalSearchQuery.trim().toLowerCase();
    const matches = Object.keys(state.journal)
      .filter(d => state.journal[d] && state.journal[d].toLowerCase().includes(q))
      .sort().reverse();
    let resultsHtml = '';
    if(matches.length===0){
      resultsHtml = `<div class="empty-state"><div class="big">🔍</div>لا توجد نتائج مطابقة لـ"${escapeHtml(journalSearchQuery)}"</div>`;
    } else {
      resultsHtml = matches.map(d=>{
        const text = state.journal[d];
        const idx = text.toLowerCase().indexOf(q);
        const start = Math.max(0, idx-40);
        const snippet = (start>0?'…':'') + text.slice(start, idx+q.length+60) + (idx+q.length+60<text.length?'…':'');
        const [y,m,dd] = d.split('-');
        return `
          <div class="hist-card" style="cursor:pointer;" onclick="jumpToJournalDate('${d}')">
            <div class="habit-name mono" style="margin-bottom:6px;font-size:14px;">${dd}/${m}/${y}</div>
            <div style="font-size:13.5px;color:var(--text-dim);line-height:1.7;">${escapeHtml(snippet)}</div>
          </div>
        `;
      }).join('');
    }
    return searchBar + resultsHtml;
  }

  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = todayStr();
  let cellsHtml = '';
  for(let i=0;i<startDow;i++) cellsHtml += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr===today; const isSelected = dateStr===selectedDate;
    const hasEntry = !!(state.journal[dateStr] && state.journal[dateStr].trim());
    const hd = hijriStr(new Date(calYear, calMonth, d), {day:'numeric'});
    cellsHtml += `<div class="cal-day ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectDate('${dateStr}')">${d}<span class="hday">${hd}</span>${hasEntry?'<div class="has-entry"></div>':''}</div>`;
  }
  const monthName = gregStr(new Date(calYear, calMonth, 1),{month:'long', year:'numeric'});
  const hA = hijriStr(new Date(calYear, calMonth, 1),{month:'long'}), hB = hijriStr(new Date(calYear, calMonth, daysInMonth),{month:'long', year:'numeric'});
  const hijriRange = (hA && hB) ? (hB.startsWith(hA) ? hB : hA+' – '+hB) : '';
  const entryText = state.journal[selectedDate] || '';
  const [sy,sm,sd] = selectedDate.split('-');
  return searchBar + `
    <div class="journal-layout">
      <div class="cal-card">
        <div class="cal-nav">
          <button class="nav-btn" onclick="changeMonth(1)">‹</button>
          <div class="label">${monthName}<div class="hijri-sub">${hijriRange}</div></div>
          <button class="nav-btn" onclick="changeMonth(-1)">›</button>
        </div>
        <div class="cal-grid">
          ${DOW_LABELS.map(l=>`<div class="cal-dow">${l}</div>`).join('')}
          ${cellsHtml}
        </div>
      </div>
      <div class="entry-card">
        <div class="entry-date">تدوينة يوم <span class="mono">${sd}/${sm}/${sy}</span> <span class="hijri-sub" style="display:inline">· ${hijriStr(parseD(selectedDate),{day:'numeric',month:'long',year:'numeric'})}</span></div>
        <textarea id="journal-text" placeholder="اكتب هنا أي شيء يخص هذا اليوم… أفكار، إنجازات، ملاحظات…" oninput="onJournalInput(this.value)">${escapeHtml(entryText)}</textarea>
        <div class="save-row">
          <div class="save-hint" id="save-hint">يُحفظ تلقائيًا</div>
          <button class="btn ghost" onclick="selectDate('${today}')">اذهب لليوم</button>
        </div>
      </div>
    </div>
  `;
}
window.onJournalSearch = function(val){
  journalSearchQuery = val;
  render();
  const el = document.getElementById('journal-search');
  if(el){ el.focus(); el.setSelectionRange(val.length, val.length); }
};
window.clearJournalSearch = function(){ journalSearchQuery = ''; render(); };
window.jumpToJournalDate = function(d){
  journalSearchQuery = '';
  selectedDate = d;
  const [y,m] = d.split('-');
  calYear = parseInt(y); calMonth = parseInt(m)-1;
  render();
};
window.changeMonth = function(dir){
  calMonth += dir;
  if(calMonth<0){ calMonth=11; calYear--; }
  if(calMonth>11){ calMonth=0; calYear++; }
  render();
};
window.selectDate = function(d){ selectedDate = d; render(); };

let saveTimeout=null;
window.onJournalInput = function(val){
  state.journal[selectedDate] = val;
  const hint = document.getElementById('save-hint');
  if(hint) hint.textContent = 'جارٍ الحفظ…';
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async ()=>{
    await saveJournal();
    const h = document.getElementById('save-hint');
    if(h) h.textContent = 'تم الحفظ ✓';
  }, 500);
};

function gregStr(d,o){ try{ return d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn', o); }catch(e){ return d.toLocaleDateString('ar', o); } }
function hijriStr(d,o){ try{ return d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn', o); }catch(e){ return ''; } }
function escapeHtml(s){ const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }

window.toggleTheme = function(){
  theme = theme==='dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', theme);
  saveTheme(); render();
};

function render(){
  document.body.setAttribute('data-theme', theme);
  const app = document.getElementById('app');
  let viewHtml = '';
  if(activeTab==='habits') viewHtml = renderHabitsView();
  else if(activeTab==='dashboard') viewHtml = renderDashboard();
  else if(activeTab==='history') viewHtml = renderHistoryView();
  else if(activeTab==='books') viewHtml = renderBooksView();
  else viewHtml = renderJournalView();

  app.innerHTML = `
    <div class="hero">
      <div>
        <h1>Rhythm</h1>
        <div class="sub">تتبّع عاداتك اليومية وغير حياتك </div>
      </div>
      <div class="hero-right">
        <div class="today-badge" style="font-family:Cairo,sans-serif">${gregStr(new Date(),{weekday:'long', day:'numeric', month:'long'})}<span class="hijri">${hijriStr(new Date(),{day:'numeric', month:'long', year:'numeric'})}</span></div>
        <div class="theme-btn" id="cloud-btn" onclick="cloudAction()" title="${cloudTitle()}" style="width:auto;min-width:38px;padding:0 10px;border-radius:19px;font-size:14px;">${cloudIcon()}</div>
        <div class="theme-btn" onclick="cycleSound()" title="صوت الإنجاز: ${SOUNDS.find(x=>x.id===soundId).label} — اضغط للتغيير">${SOUNDS.find(x=>x.id===soundId).icon}</div>
        <div class="theme-btn" onclick="toggleTheme()" title="تبديل النمط">${theme==='dark'?'☀':'☾'}</div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab ${activeTab==='habits'?'active':''}" onclick="setTab('habits')">العادات</div>
      <div class="tab ${activeTab==='dashboard'?'active':''}" onclick="setTab('dashboard')">لوحة التحكم</div>
      <div class="tab ${activeTab==='history'?'active':''}" onclick="setTab('history')">السجل</div>
      <div class="tab ${activeTab==='books'?'active':''}" onclick="setTab('books')">الكتب</div>
      <div class="tab ${activeTab==='journal'?'active':''}" onclick="setTab('journal')">التدوين</div>
    </div>
    <div class="view active">${viewHtml}</div>
  `;
}
window.setTab = function(t){ activeTab=t; render(); };

(async function init(){ await loadState(); render(); initCloud(); })();
</script>
